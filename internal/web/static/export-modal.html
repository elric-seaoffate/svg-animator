<div id="exportModal" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Export Studio</h2>
      <button class="close-btn" onclick="closeExportModal()">✕</button>
    </div>
    
    <div class="modal-body">
      <!-- Left Column: Settings -->
      <div class="export-settings">
        <div class="setting-group">
          <label>File Name</label>
          <input type="text" id="expFilename" value="animation_export">
        </div>
        
        <div class="setting-row">
          <div class="setting-group">
            <label>Width (px)</label>
            <input type="number" id="expWidth">
          </div>
          <div class="setting-group">
            <label>Height (px)</label>
            <input type="number" id="expHeight">
          </div>
        </div>

        <div class="setting-group">
          <label>Format & Quality</label>
          <select id="expFormat">
            <option value="webp">Animated WebP</option>
            <option value="apng">Animated PNG (APNG)</option>
          </select>
          <select id="expFps">
            <option value="15">15 FPS (Fast Draft Preview)</option>
            <option value="30" selected>30 FPS (Standard)</option>
            <option value="60">60 FPS (Cinematic Smooth)</option>
          </select>
        </div>

        <div class="setting-group">
          <label>Playback Mode</label>
          <select id="expLoop">
            <option value="once">Play Once (Stops at end)</option>
            <option value="loop" selected>Continuous Loop</option>
          </select>
        </div>

        <div class="setting-group">
          <label>Effect Overrides</label>
          <label class="toggle-label"><input type="checkbox" id="expEnableOptical" checked> Optical Blurs (Ken Burns, Tilt-Shift)</label>
          <label class="toggle-label"><input type="checkbox" id="expEnableOverlays" checked> Looping Overlays (Data Flows, Glows)</label>
          <label class="toggle-label"><input type="checkbox" id="expEnableFrame" checked> Physical Frame</label>
        </div>
      </div>

      <!-- Right Column: RAM Preview -->
      <div class="export-preview">
        <div id="previewContainer" class="preview-box">
          <span id="previewPlaceholder">Click "Generate Preview" to render...</span>
          <img id="previewImage" style="display: none;" />
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" onclick="generatePreview()">Generate Preview (RAM)</button>
      <button class="btn-primary" onclick="downloadFinal()">Download Final File</button>
    </div>
  </div>
</div>
